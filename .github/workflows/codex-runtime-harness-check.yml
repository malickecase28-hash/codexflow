name: Runtime harness check

on:
  push:
    paths:
      - "codex-rs/runtime-harness/**"
      - ".github/workflows/codex-runtime-harness-check.yml"
  pull_request:
    paths:
      - "codex-rs/runtime-harness/**"
      - ".github/workflows/codex-runtime-harness-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Runtime harness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Normalize format for validation
        run: cargo fmt --manifest-path codex-rs/runtime-harness/Cargo.toml
      - name: Test
        run: cargo test --manifest-path codex-rs/runtime-harness/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path codex-rs/runtime-harness/Cargo.toml --all-targets -- -D warnings
      - name: Verify formatting is stable
        run: cargo fmt --manifest-path codex-rs/runtime-harness/Cargo.toml -- --check
