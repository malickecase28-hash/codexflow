name: CodexFlow branch remediation

on:
  push:
    branches:
      - codexflow/phase3c-event-runtime-master-map
    paths:
      - .github/workflows/codexflow-branch-remediation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codexflow-branch-remediation
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codexflow/phase3c-event-runtime-master-map
          fetch-depth: 0
          persist-credentials: true

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          toolchain: "1.98.1"
          components: rustfmt

      - name: Apply guarded runtime transformations and formatting
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/phase3c_complete.py
          python .github/scripts/phase3c_harden.py
          python .github/scripts/phase3c_supervisor_lock_harden.py
          python .github/scripts/phase3c_lease_harden.py
          python .github/scripts/phase3c_lease_lock_token_harden.py
          cd codex-rs
          cargo fmt --all
          cd ..
          git diff --check

      - name: Prepare Bazel lock update
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: branch-remediation

      - name: Refresh Bazel module lock
        shell: bash
        run: |
          set -euo pipefail
          just bazel-lock-update
          ./scripts/check-module-bazel-lock.sh
          git diff --check

      - name: Commit normalized branch state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-rs .github/workflows/codexflow-prebuilt-windows.yml MODULE.bazel.lock
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No normalization changes to commit."
            exit 0
          fi
          git commit -m "chore: normalize Phase 3C runtime and Bazel lock"
          git fetch origin codexflow/phase3c-event-runtime-master-map
          git rebase origin/codexflow/phase3c-event-runtime-master-map
          git push origin HEAD:codexflow/phase3c-event-runtime-master-map
