name: codexflow-branch-remediation

on:
  push:
    branches:
      - codexflow/phase3c-event-runtime-master-map

permissions:
  contents: write

concurrency:
  group: codexflow-branch-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codexflow/phase3c-event-runtime-master-map
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare Bazel CI
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: codexflow-remediation

      - name: Install repository Rust toolchain with rustfmt
        shell: bash
        run: rustup toolchain install 1.98.1 --component rustfmt --profile minimal --no-self-update

      - name: Format Rust sources
        shell: bash
        run: cargo +1.98.1 fmt -- --config imports_granularity=Item

      - name: Refresh Bazel lockfile
        shell: bash
        run: just bazel-lock-update

      - name: Commit remediation to feature branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet --exit-code; then
            echo "No tracked remediation changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add MODULE.bazel.lock
          git commit -m "chore(ci): apply codexflow remediation"
          git push origin HEAD:codexflow/phase3c-event-runtime-master-map
