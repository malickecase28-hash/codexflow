name: codexflow-cargo-lock-remediation

on:
  push:
    branches:
      - codexflow/phase3c-event-runtime-master-map
    paths:
      - .github/workflows/codexflow-cargo-lock-remediation.yml

permissions:
  contents: write

concurrency:
  group: codexflow-cargo-lock-remediation
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codexflow/phase3c-event-runtime-master-map
          fetch-depth: 0
          persist-credentials: true

      - uses: ./.github/actions/setup-ci

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          toolchain: "1.98.1"

      - name: Refresh Cargo lockfile using repository metadata
        shell: bash
        working-directory: codex-rs
        run: cargo +1.98.1 metadata --format-version 1 --no-deps >/dev/null

      - name: Commit refreshed lockfile and retire this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/codexflow-cargo-lock-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-rs/Cargo.lock .github/workflows/codexflow-cargo-lock-remediation.yml
          if git diff --cached --quiet --exit-code; then
            echo "Cargo.lock did not need changes; retiring remediation workflow only."
          fi
          git commit -m "chore: refresh Cargo lockfile for Rust 1.98"
          git push origin HEAD:codexflow/phase3c-event-runtime-master-map
