name: codexflow-cargo-shear-remediation

on:
  push:
    branches:
      - codexflow/phase3c-event-runtime-master-map
    paths:
      - .github/workflows/codexflow-cargo-shear-remediation.yml

permissions:
  contents: write

concurrency:
  group: codexflow-cargo-shear-remediation
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codexflow/phase3c-event-runtime-master-map
          fetch-depth: 0
          persist-credentials: true

      - uses: ./.github/actions/setup-ci

      - name: Install blocking-CI Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: "1.95.0"

      - name: Install cargo-shear used by blocking CI
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-shear@1.11.2

      - name: Reproduce cargo shear normalization
        shell: bash
        working-directory: codex-rs
        run: cargo shear --deny-warnings

      - name: Commit normalized lockfile and retire this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/codexflow-cargo-shear-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-rs/Cargo.lock .github/workflows/codexflow-cargo-shear-remediation.yml
          git commit -m "chore: normalize Cargo lock for cargo-shear"
          git push origin HEAD:codexflow/phase3c-event-runtime-master-map
