name: codexflow-source-check

on:
  workflow_dispatch:
  push:
    branches:
      - "codexflow/phase2*"
      - "codexflow/phase3*"
    paths:
      - "codex-rs/**"
      - "tools/codexflow/**"
      - ".github/workflows/codexflow-source-check.yml"
  pull_request:
    paths:
      - "codex-rs/**"
      - "tools/codexflow/**"
      - ".github/workflows/codexflow-source-check.yml"

permissions:
  contents: read

concurrency:
  group: codexflow-source-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-check:
    name: CodexFlow cargo check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_CACHE_SIZE: 5G
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          toolchain: "1.98.1"
          components: rustfmt

      - name: Restore Cargo dependency cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: codexflow-source-cargo-${{ runner.os }}-rust-1.98.1-${{ hashFiles('codex-rs/Cargo.lock') }}
          restore-keys: |
            codexflow-source-cargo-${{ runner.os }}-rust-1.98.1-

      - name: Install sccache
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: sccache
          version: 0.7.5

      - name: Configure sccache GitHub backend
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ACTIONS_CACHE_URL:-}" && -n "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            echo "SCCACHE_DIR=${RUNNER_TEMP}/codexflow-sccache" >> "$GITHUB_ENV"
          fi
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      - name: Format disposable checkout
        run: cargo fmt

      - name: Check CodexFlow runtime binaries
        run: cargo check -p codex-cli --bin codexflow --bin codexflow-supervisor

      - name: Run CodexFlow context and CLI tests
        run: cargo test -p codex-cli --bin codexflow

      - name: Build CodexFlow recovery eval binary
        run: cargo build -p codex-cli --bin codexflow

      - name: Run failure-aware recovery policy eval
        run: python3 ../tools/codexflow/recovery_eval.py --bin "$CARGO_TARGET_DIR/debug/codexflow"

      - name: Run CodexFlow supervisor durability tests
        run: cargo test -p codex-cli --bin codexflow-supervisor

      - name: Run wait-agent event behavior tests
        run: cargo test -p codex-core 'multi_agents_v2::wait::tests::'

      - name: Run wait-agent schema tests
        run: cargo test -p codex-core 'wait_agent_tool_v2_'

      - name: Show sccache statistics
        if: always()
        run: sccache --show-stats || true
