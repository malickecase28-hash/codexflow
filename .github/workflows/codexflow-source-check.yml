name: codexflow-source-check

on:
  workflow_dispatch:
  push:
    branches:
      - "codexflow/phase2*"
      - "codexflow/phase3*"
    paths:
      - "codex-rs/**"
      - ".github/workflows/codexflow-source-check.yml"
  pull_request:
    paths:
      - "codex-rs/**"
      - ".github/workflows/codexflow-source-check.yml"

permissions:
  contents: read

concurrency:
  group: codexflow-source-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-check:
    name: CodexFlow cargo check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt

      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu

      - name: Format disposable checkout
        run: cargo fmt

      - name: Check CodexFlow runtime binaries
        run: cargo check -p codex-cli --bin codexflow --bin codexflow-supervisor

      - name: Run wait-agent event behavior tests
        run: cargo test -p codex-core 'multi_agents_v2::wait::tests::'

      - name: Run wait-agent schema tests
        run: cargo test -p codex-core 'wait_agent_tool_v2_'
