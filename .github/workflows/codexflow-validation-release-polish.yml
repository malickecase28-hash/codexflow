name: codexflow-validation-release-polish

on:
  push:
    branches:
      - codexflow/validation-package-release
    paths:
      - "tools/codexflow/apply_release_polish.py"
      - ".github/workflows/codexflow-validation-release-polish.yml"

permissions:
  contents: write

concurrency:
  group: codexflow-validation-release-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Materialize release workflow polish
        run: python3 tools/codexflow/apply_release_polish.py

      - name: Parse materialized workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true)' .github/workflows/codexflow-release.yml

      - name: Validate release workflow invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'SCCACHE_CACHE_SIZE: 10G' .github/workflows/codexflow-release.yml
          grep -q 'RUSTC_WRAPPER=sccache' .github/workflows/codexflow-release.yml
          grep -q 'windows-11-arm' .github/workflows/codexflow-release.yml
          grep -q 'ubuntu-24.04-arm' .github/workflows/codexflow-release.yml
          grep -q 'macos-15-intel' .github/workflows/codexflow-release.yml
          grep -q 'macos-15' .github/workflows/codexflow-release.yml
          grep -q 'compiler-invoked' .github/workflows/codexflow-release.yml
          test "$(grep -c 'runtime: .*-' .github/workflows/codexflow-release.yml)" -ge 6

      - name: Commit validated release workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/codexflow-release.yml
          if git diff --cached --quiet; then
            echo "No materialized release diff"
          else
            git commit -m "validation: materialize cached six-target release"
            git push origin HEAD:codexflow/validation-package-release
          fi
