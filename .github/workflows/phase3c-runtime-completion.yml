                      .with_context(|| format!("open {}", parent.display()))?
                      .sync_all()
                      .with_context(|| format!("sync {}", parent.display()))?;
              }
              Ok(())
          }

          #[cfg(not(unix))]
          fn sync_parent_directory(_path: &Path) -> Result<()> {
              Ok(())
          }
