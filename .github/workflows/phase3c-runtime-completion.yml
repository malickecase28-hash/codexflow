                  let due_ids = awaits
                      .iter()
                      .filter_map(|(id, spec)| {
                          if spec.state != "waiting" {
                              return None;
                          }
                          let deadline = spec
                              .timeout_at
                              .as_deref()
                              .and_then(|value| DateTime::parse_from_rfc3339(value).ok())?;
