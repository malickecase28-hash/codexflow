                      })
                      .collect::<Vec<_>>();
                  for id in &due_ids {
                      let owner = awaits
                          .get(id)
                          .with_context(|| format!("missing due await: {id}"))?
                          .owner
                          .clone();
                      let (event, _) = append_or_reuse_event_unlocked(
