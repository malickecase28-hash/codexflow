name: Phase 3C runtime completion

on:
  push:
    branches:
      - codexflow/phase3c-event-runtime-master-map
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codexflow/phase3c-event-runtime-master-map
          fetch-depth: 0
          persist-credentials: true

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          toolchain: "1.98.1"
          components: rustfmt

      - name: Complete Phase 3C runtime
        shell: bash
        run: |
          set -euo pipefail
          cat > codex-rs/cli/src/bin/codexflow/event.rs <<'RS'
          use super::sibling_executable;
          use anyhow::Context;
          use anyhow::Result;
          use anyhow::bail;
          use clap::Args;
          use clap::Subcommand;
          use std::ffi::OsString;
          use std::path::Path;
          use std::process::Command;

          #[derive(Debug, Args)]
          pub(super) struct EventArgs {
              #[arg(long)]
              pub(super) project: Option<String>,
              #[command(subcommand)]
              command: EventCommand,
          }

          #[derive(Debug, Subcommand)]
          enum EventCommand {
              Run {
                  #[arg(long, default_value = "127.0.0.1:0")]
                  bind: String,
              },
              Publish {
                  #[arg(long)]
                  kind: String,
                  #[arg(long)]
                  key: Option<String>,
                  #[arg(long)]
                  dedupe_key: Option<String>,
                  #[arg(long, default_value = "{}")]
                  payload: String,
              },
              Await {
                  #[arg(long)]
                  id: String,
                  #[arg(long)]
                  owner: String,
                  #[arg(long = "topic", required = true)]
                  topics: Vec<String>,
                  #[arg(long)]
                  key: Option<String>,
                  #[arg(long, default_value_t = 0)]
                  after_seq: u64,
                  #[arg(long)]
                  timeout_at: Option<String>,
              },
              Inbox {
                  #[arg(long)]
                  owner: String,
                  #[arg(long)]
                  clear: bool,
              },
              Status,
          }

          pub(super) fn handle(project_root: &Path, args: EventArgs) -> Result<()> {
              let executable = sibling_executable("codexflow-supervisor")?;
              let command_args = command_args(project_root, &args.command);
              let status = Command::new(&executable)
                  .args(command_args)
                  .status()
                  .with_context(|| format!("run {}", executable.display()))?;
              if !status.success() {
                  bail!("codexflow-supervisor exited with {status}");
              }
              Ok(())
          }

          fn command_args(project_root: &Path, command: &EventCommand) -> Vec<OsString> {
              let mut args = Vec::new();
              match command {
                  EventCommand::Run { bind } => {
                      args.push("run".into());
                      args.push("--project-root".into());
                      args.push(project_root.as_os_str().to_owned());
                      args.push("--bind".into());
                      args.push(bind.into());
                  }
                  EventCommand::Publish {
                      kind,
                      key,
                      dedupe_key,
                      payload,
                  } => {
                      args.push("publish".into());
                      args.push("--project-root".into());
                      args.push(project_root.as_os_str().to_owned());
                      args.push("--kind".into());
                      args.push(kind.into());
                      if let Some(key) = key {
                          args.push("--key".into());
                          args.push(key.into());
                      }
                      if let Some(dedupe_key) = dedupe_key {
                          args.push("--dedupe-key".into());
                          args.push(dedupe_key.into());
                      }
                      args.push("--payload".into());
                      args.push(payload.into());
                  }
                  EventCommand::Await {
                      id,
                      owner,
                      topics,
                      key,
                      after_seq,
                      timeout_at,
                  } => {
                      args.push("await".into());
                      args.push("--project-root".into());
                      args.push(project_root.as_os_str().to_owned());
                      args.push("--id".into());
                      args.push(id.into());
                      args.push("--owner".into());
                      args.push(owner.into());
                      for topic in topics {
                          args.push("--topic".into());
                          args.push(topic.into());
                      }
                      if let Some(key) = key {
                          args.push("--key".into());
                          args.push(key.into());
                      }
                      args.push("--after-seq".into());
                      args.push(after_seq.to_string().into());
                      if let Some(timeout_at) = timeout_at {
                          args.push("--timeout-at".into());
                          args.push(timeout_at.into());
                      }
                  }
                  EventCommand::Inbox { owner, clear } => {
                      args.push("inbox".into());
                      args.push("--project-root".into());
                      args.push(project_root.as_os_str().to_owned());
                      args.push("--owner".into());
                      args.push(owner.into());
                      if *clear {
                          args.push("--clear".into());
                      }
                  }
                  EventCommand::Status => {
                      args.push("status".into());
                      args.push("--project-root".into());
                      args.push(project_root.as_os_str().to_owned());
                  }
              }
              args
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn publish_args_forward_dedupe_key() {
                  let args = command_args(
                      Path::new("/repo"),
                      &EventCommand::Publish {
                          kind: "build.completed".to_string(),
                          key: Some("job-1".to_string()),
                          dedupe_key: Some("build:job-1".to_string()),
                          payload: "{}".to_string(),
                      },
                  );
                  let rendered = args
                      .iter()
                      .map(|arg| arg.to_string_lossy().into_owned())
                      .collect::<Vec<_>>();
                  assert!(rendered.windows(2).any(|pair| pair == ["--dedupe-key", "build:job-1"]));
              }

              #[test]
              fn await_args_forward_timeout_deadline() {
                  let args = command_args(
                      Path::new("/repo"),
                      &EventCommand::Await {
                          id: "wait-1".to_string(),
                          owner: "god".to_string(),
                          topics: vec!["build.completed".to_string()],
                          key: None,
                          after_seq: 7,
                          timeout_at: Some("2030-01-01T00:00:00Z".to_string()),
                      },
                  );
                  let rendered = args
                      .iter()
                      .map(|arg| arg.to_string_lossy().into_owned())
                      .collect::<Vec<_>>();
                  assert!(rendered.windows(2).any(|pair| pair == ["--timeout-at", "2030-01-01T00:00:00Z"]));
              }
          }
          RS

          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one patch target, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          cli = Path("codex-rs/cli/src/bin/codexflow.rs")
          replace_once(
              cli,
