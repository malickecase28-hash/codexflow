          )
          replace_once(
              cli,
              '    Delivery(delivery::DeliveryArgs),\n    Caretaker(caretaker::CaretakerArgs),\n',
              '    Delivery(delivery::DeliveryArgs),\n    Event(event_runtime::EventArgs),\n    Caretaker(caretaker::CaretakerArgs),\n',
          )
          replace_once(
              cli,
              '                Some(TopCommand::Delivery(args)) => {\n                    let project = resolve_scoped_project(&runtime, args.project.as_deref()).await?;\n                    delivery::handle(&primary_root(&project)?, args)\n                }\n                Some(TopCommand::Caretaker(args)) => {',
              '                Some(TopCommand::Delivery(args)) => {\n                    let project = resolve_scoped_project(&runtime, args.project.as_deref()).await?;\n                    delivery::handle(&primary_root(&project)?, args)\n                }\n                Some(TopCommand::Event(args)) => {\n                    let project = resolve_scoped_project(&runtime, args.project.as_deref()).await?;\n                    event_runtime::handle(&primary_root(&project)?, args)\n                }\n                Some(TopCommand::Caretaker(args)) => {',
          )
          replace_once(
              cli,
              '''fn sibling_codex_executable() -> Result<PathBuf> {
              let current = std::env::current_exe().context("resolve codexflow executable")?;
              let sibling_name = if cfg!(windows) { "codex.exe" } else { "codex" };
              if let Some(parent) = current.parent() {
                  let sibling = parent.join(sibling_name);
                  if sibling.is_file() {
                      return Ok(sibling);
                  }
              }
              let path = which::which("codex").context("find codex executable on PATH")?;
              if path == current {
                  bail!("resolved codex executable points back to codexflow");
              }
              Ok(path)
          }
          ''',
              '''fn sibling_executable(name: &str) -> Result<PathBuf> {
              let current = std::env::current_exe().context("resolve codexflow executable")?;
              let sibling_name = if cfg!(windows) {
                  format!("{name}.exe")
              } else {
                  name.to_string()
              };
              if let Some(parent) = current.parent() {
                  let sibling = parent.join(&sibling_name);
                  if sibling.is_file() {
                      return Ok(sibling);
                  }
              }
              let path = which::which(name).with_context(|| format!("find {name} executable on PATH"))?;
              if path == current {
                  bail!("resolved {name} executable points back to codexflow");
              }
              Ok(path)
          }

          fn sibling_codex_executable() -> Result<PathBuf> {
              sibling_executable("codex")
          }
          ''',
          )
          replace_once(
              cli,
              '''    #[test]
              fn idempotency_key_uses_primary_root() {
          ''',
              '''    #[test]
              fn event_command_is_exposed_on_public_cli() {
                  let cli = Cli::try_parse_from([
                      "codexflow",
                      "event",
                      "--project",
                      "demo",
                      "status",
                  ])
                  .expect("event command should parse");
                  let Some(TopCommand::Event(args)) = cli.command else {
                      panic!("expected event command");
                  };
                  assert_eq!(args.project.as_deref(), Some("demo"));
              }

              #[test]
              fn idempotency_key_uses_primary_root() {
          ''',
          )

          cargo = Path("codex-rs/cli/Cargo.toml")
          replace_once(
              cargo,
              '    "Win32_Storage_Packaging_Appx",\n',
              '    "Win32_Storage_FileSystem",\n    "Win32_Storage_Packaging_Appx",\n',
          )

          windows = Path(".github/workflows/codexflow-prebuilt-windows.yml")
          replace_once(
              windows,
              '          toolchain: "1.95.0"\n',
              '          toolchain: "1.98.1"\n',
          )
          marker = '''      - name: Build CodexFlow runtime bundle
                  shell: pwsh
                  run: |
          '''
          replacement = '''      - name: Test CodexFlow runtime bundle
                  shell: pwsh
                  run: |
                    $env:LIBSQLITE3_FLAGS = "SQLITE_DISABLE_INTRINSIC"
                    cargo test --locked --target x86_64-pc-windows-msvc -p codex-cli --bin codexflow --bin codexflow-supervisor

                - name: Build CodexFlow runtime bundle
                  shell: pwsh
                  run: |
          '''
          replace_once(windows, marker, replacement)
          PY

          python - <<'PY'
          from pathlib import Path

          path = Path("codex-rs/cli/src/bin/codexflow-supervisor.rs")
          text = path.read_text(encoding="utf-8")

          def rep(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"supervisor patch target count {count} for: {old[:80]!r}")
              text = text.replace(old, new, 1)

          rep('use chrono::Utc;\n', 'use chrono::DateTime;\nuse chrono::Utc;\n')
          rep('use std::net::TcpListener;\nuse std::net::TcpStream;\n', 'use std::net::SocketAddr;\nuse std::net::TcpListener;\nuse std::net::TcpStream;\n')
          rep('use std::path::PathBuf;\n', 'use std::path::PathBuf;\n#[cfg(windows)]\nuse std::os::windows::ffi::OsStrExt;\n')
          rep('const SUPERVISOR_IO_TIMEOUT: Duration = Duration::from_secs(30);\n', 'const SUPERVISOR_IO_TIMEOUT: Duration = Duration::from_secs(30);\nconst TIMER_TICK: Duration = Duration::from_millis(50);\n')

          rep('''        #[arg(long)]
                  key: Option<String>,
                  #[arg(long, default_value = "{}")]
                  payload: String,
          ''', '''        #[arg(long)]
                  key: Option<String>,
                  #[arg(long)]
                  dedupe_key: Option<String>,
                  #[arg(long, default_value = "{}")]
                  payload: String,
          ''')
          rep('''        #[arg(long, default_value_t = 0)]
                  after_seq: u64,
              },
          ''', '''        #[arg(long, default_value_t = 0)]
                  after_seq: u64,
                  #[arg(long)]
                  timeout_at: Option<String>,
              },
          ''')
          rep('''    key: Option<String>,
              payload: Value,
              created_at: String,
          ''', '''    key: Option<String>,
              #[serde(default)]
              dedupe_key: Option<String>,
              payload: Value,
              created_at: String,
          ''')
          rep('''    after_seq: u64,
              state: String,
          ''', '''    after_seq: u64,
              #[serde(default)]
              timeout_at: Option<String>,
              state: String,
          ''')
          rep('''    Publish {
                  kind: String,
                  key: Option<String>,
                  payload: Value,
              },
          ''', '''    Publish {
                  kind: String,
                  key: Option<String>,
                  #[serde(default)]
                  dedupe_key: Option<String>,
                  payload: Value,
              },
          ''')
          rep('''        key: Option<String>,
                  after_seq: u64,
              },
          ''', '''        key: Option<String>,
                  after_seq: u64,
                  #[serde(default)]
                  timeout_at: Option<String>,
              },
          ''')
          rep('''enum SupervisorSendError {
              NotDispatched(anyhow::Error),
              DoNotReplay(anyhow::Error),
          }
          ''', '''enum SupervisorSendError {
              NotDispatched,
              DoNotReplay(anyhow::Error),
          }
          ''')

          rep('''        Command::Publish {
                      project_root,
                      kind,
                      key,
                      payload,
                  } => {
          ''', '''        Command::Publish {
                      project_root,
                      kind,
                      key,
                      dedupe_key,
                      payload,
                  } => {
          ''')
          rep('''                WireRequest::Publish { kind, key, payload },
          ''', '''                WireRequest::Publish {
                      kind,
                      key,
                      dedupe_key,
                      payload,
                  },
          ''')
          rep('''            key,
                      after_seq,
                  } => {
          ''', '''            key,
                      after_seq,
                      timeout_at,
                  } => {
          ''')
          rep('''                    key,
                          after_seq,
                      },
          ''', '''                    key,
                          after_seq,
                          timeout_at,
                      },
          ''')

          old_run = '''fn run_supervisor(project_root: &Path, bind: &str) -> Result<()> {
              ensure_state_dirs(project_root)?;
              reconcile_waiting_awaits(project_root)?;
              let listener = TcpListener::bind(bind).with_context(|| format!("bind supervisor to {bind}"))?;
              let address = listener.local_addr().context("read supervisor address")?;
              let endpoint = SupervisorEndpoint {
                  schema: ENDPOINT_SCHEMA.to_string(),
                  address: address.to_string(),
                  pid: std::process::id(),
                  started_at: now_iso(),
              };
              write_json_atomic(&endpoint_path(project_root), &endpoint)?;
              println!("{}", serde_json::to_string_pretty(&endpoint)?);

              for incoming in listener.incoming() {
                  match incoming {
                      Ok(stream) => {
                          if let Err(err) = handle_connection(project_root, stream) {
                              eprintln!("CodexFlow supervisor request failed: {err:#}");
                          }
                      }
                      Err(err) => eprintln!("CodexFlow supervisor accept failed: {err}"),
                  }
              }
              Ok(())
          }
          '''
          new_run = '''fn run_supervisor(project_root: &Path, bind: &str) -> Result<()> {
              ensure_state_dirs(project_root)?;
              reconcile_waiting_awaits(project_root)?;
              process_due_timeouts(project_root)?;
              let bind_address = parse_loopback_address(bind)?;
              let listener = TcpListener::bind(bind_address)
                  .with_context(|| format!("bind supervisor to {bind_address}"))?;
              listener
                  .set_nonblocking(true)
                  .context("set supervisor listener nonblocking")?;
              let address = listener.local_addr().context("read supervisor address")?;
              let endpoint = SupervisorEndpoint {
                  schema: ENDPOINT_SCHEMA.to_string(),
                  address: address.to_string(),
                  pid: std::process::id(),
                  started_at: now_iso(),
              };
              write_json_atomic(&endpoint_path(project_root), &endpoint)?;
              println!("{}", serde_json::to_string_pretty(&endpoint)?);

              loop {
                  process_due_timeouts(project_root)?;
                  match listener.accept() {
                      Ok((stream, _)) => {
                          let root = project_root.to_path_buf();
                          thread::spawn(move || {
                              if let Err(err) = handle_connection(&root, stream) {
                                  eprintln!("CodexFlow supervisor request failed: {err:#}");
                              }
                          });
                      }
                      Err(err) if err.kind() == std::io::ErrorKind::WouldBlock => {
                          thread::sleep(TIMER_TICK);
                      }
                      Err(err) => {
                          eprintln!("CodexFlow supervisor accept failed: {err}");
                          thread::sleep(TIMER_TICK);
                      }
                  }
              }
          }
          '''
          rep(old_run, new_run)

          rep('''fn handle_connection(project_root: &Path, mut stream: TcpStream) -> Result<()> {
              let read_stream = stream.try_clone().context("clone supervisor socket")?;
          ''', '''fn handle_connection(project_root: &Path, mut stream: TcpStream) -> Result<()> {
              stream
                  .set_read_timeout(Some(SUPERVISOR_IO_TIMEOUT))
                  .context("set supervisor request read timeout")?;
              stream
                  .set_write_timeout(Some(SUPERVISOR_IO_TIMEOUT))
                  .context("set supervisor response write timeout")?;
              let read_stream = stream.try_clone().context("clone supervisor socket")?;
          ''')

          rep('Err(SupervisorSendError::NotDispatched(_)) => {}', 'Err(SupervisorSendError::NotDispatched) => {}')
          start = text.index('fn send_request(\n')
          end = text.index('\nfn execute_request(', start)
          text = text[:start] + '''fn send_request(
              endpoint: &SupervisorEndpoint,
              request: &WireRequest,
          ) -> std::result::Result<Value, SupervisorSendError> {
              if endpoint.schema != ENDPOINT_SCHEMA {
                  return Err(SupervisorSendError::NotDispatched);
              }
              let address = parse_loopback_address(&endpoint.address)
                  .map_err(|_| SupervisorSendError::NotDispatched)?;
              let encoded = serde_json::to_string(request)
                  .map_err(|_| SupervisorSendError::NotDispatched)?;
              let mut stream = TcpStream::connect(address)
                  .map_err(|_| SupervisorSendError::NotDispatched)?;
              stream
                  .set_read_timeout(Some(SUPERVISOR_IO_TIMEOUT))
                  .map_err(|_| SupervisorSendError::NotDispatched)?;
              stream
                  .set_write_timeout(Some(SUPERVISOR_IO_TIMEOUT))
                  .map_err(|_| SupervisorSendError::NotDispatched)?;
              writeln!(stream, "{encoded}").map_err(|err| SupervisorSendError::DoNotReplay(err.into()))?;
              stream
                  .flush()
                  .map_err(|err| SupervisorSendError::DoNotReplay(err.into()))?;
              let mut reader = BufReader::new(stream);
              let mut line = String::new();
              let bytes = reader
                  .read_line(&mut line)
                  .map_err(|err| SupervisorSendError::DoNotReplay(anyhow::Error::new(err)))?;
              if bytes == 0 || line.trim().is_empty() {
                  return Err(SupervisorSendError::DoNotReplay(anyhow::Error::msg(
                      "supervisor closed the connection without a response",
                  )));
              }
              let response: WireResponse = serde_json::from_str(line.trim_end()).map_err(|err| {
                  SupervisorSendError::DoNotReplay(
                      anyhow::Error::new(err).context("parse supervisor response"),
                  )
              })?;
              if !response.ok {
                  return Err(SupervisorSendError::DoNotReplay(anyhow::Error::msg(
                      response
                          .error
                          .unwrap_or_else(|| "supervisor request failed".to_string()),
                  )));
              }
              Ok(response.value.unwrap_or(Value::Null))
          }
          ''' + text[end:]

          start = text.index('fn execute_request(')
          end = text.index('\nfn same_await_registration(', start)
          text = text[:start] + '''fn execute_request(project_root: &Path, request: WireRequest) -> Result<Value> {
              ensure_state_dirs(project_root)?;
              match request {
                  WireRequest::Publish {
                      kind,
                      key,
                      dedupe_key,
                      payload,
                  } => {
                      validate_event_kind(&kind)?;
                      validate_key(key.as_deref())?;
                      validate_dedupe_key(dedupe_key.as_deref())?;
                      publish_event(project_root, kind, key, dedupe_key, payload)
                  }
                  WireRequest::RegisterAwait {
                      id,
                      owner,
                      topics,
                      key,
                      after_seq,
                      timeout_at,
                  } => register_await(
                      project_root,
                      id,
                      owner,
                      topics,
                      key,
                      after_seq,
                      timeout_at,
                  ),
                  WireRequest::Inbox { owner, clear } => read_inbox(project_root, &owner, clear),
                  WireRequest::Status => supervisor_status(project_root),
              }
          }

          fn publish_event(
              project_root: &Path,
              kind: String,
              key: Option<String>,
              dedupe_key: Option<String>,
              payload: Value,
          ) -> Result<Value> {
              with_state_lock(project_root, || {
                  let (event, duplicate) = append_or_reuse_event_unlocked(
                      project_root,
                      kind,
                      key,
                      dedupe_key,
                      payload,
                  )?;
                  let matched = resolve_event_against_awaits(project_root, &event)?;
                  Ok(json!({
                      "event": event,
                      "matched_awaits": matched,
                      "duplicate": duplicate
                  }))
              })
          }

          fn append_or_reuse_event_unlocked(
              project_root: &Path,
              kind: String,
              key: Option<String>,
              dedupe_key: Option<String>,
              payload: Value,
          ) -> Result<(EventEnvelope, bool)> {
              let events: Vec<EventEnvelope> = read_json_lines(&events_path(project_root))?;
              if let Some(dedupe_key) = dedupe_key.as_deref()
                  && let Some(existing) = events
                      .iter()
                      .find(|event| event.dedupe_key.as_deref() == Some(dedupe_key))
              {
                  if existing.kind != kind || existing.key != key || existing.payload != payload {
                      bail!("event dedupe key already exists with different content: {dedupe_key}");
                  }
                  return Ok((existing.clone(), true));
              }
              let seq = events.last().map_or(0, |event| event.seq).saturating_add(1);
              let event = EventEnvelope {
                  schema: EVENT_SCHEMA.to_string(),
                  seq,
                  id: format!("ev-{seq}"),
                  kind,
                  key,
                  dedupe_key,
                  payload,
                  created_at: now_iso(),
              };
              append_json_line(&events_path(project_root), &event)?;
              Ok((event, false))
          }

          fn register_await(
              project_root: &Path,
              id: String,
              owner: String,
              topics: Vec<String>,
              key: Option<String>,
              after_seq: u64,
              timeout_at: Option<String>,
          ) -> Result<Value> {
              validate_id(&id)?;
              validate_owner(&owner)?;
              validate_topics(&topics)?;
              validate_key(key.as_deref())?;
              let timeout_at = normalize_timeout_at(timeout_at.as_deref())?;
              with_state_lock(project_root, || {
                  let mut awaits = load_awaits(project_root)?;
                  if let Some(existing) = awaits.get(&id) {
                      if same_await_registration(
                          existing,
                          &owner,
                          &topics,
                          key.as_deref(),
                          after_seq,
