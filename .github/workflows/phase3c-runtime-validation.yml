name: Phase 3C runtime validation

on:
  push:
    branches:
      - codexflow/phase3c-event-runtime-master-map
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase3c-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complete-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codexflow/phase3c-event-runtime-master-map
          fetch-depth: 0
          persist-credentials: true

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          toolchain: "1.98.1"
          components: rustfmt

      - name: Apply guarded Phase 3C transformations
        run: |
          python .github/scripts/phase3c_complete.py
          python .github/scripts/phase3c_harden.py
          python .github/scripts/phase3c_lease_harden.py
          python .github/scripts/phase3c_lease_lock_token_harden.py

      - name: Format and validate runtime
        shell: bash
        run: |
          set -euo pipefail
          cd codex-rs
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check -p codex-cli --bin codexflow --bin codexflow-supervisor
          cargo test -p codex-cli --bin codexflow
          cargo test -p codex-cli --bin codexflow-supervisor
          cargo test -p codex-core 'multi_agents_v2::wait::tests::'
          cargo test -p codex-core 'wait_agent_tool_v2_'
          cd ..
          git diff --check

      - name: Prepare Bazel lock validation
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: phase3c-lock

      - name: Refresh and verify Bazel module lock
        shell: bash
        run: |
          set -euo pipefail
          just bazel-lock-update
          ./scripts/check-module-bazel-lock.sh
          git diff --check

      - name: Commit completed Phase 3C runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-rs \
                  .github/workflows/codexflow-prebuilt-windows.yml \
                  MODULE.bazel.lock
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No Phase 3C source changes to commit."
            exit 0
          fi
          git commit -m "feat: complete Phase 3C durable event runtime"
          test -z "$(git status --porcelain --untracked-files=normal)" || {
            echo "::error::completion left unstaged or untracked files"
            git status --short
            exit 1
          }
          git fetch origin codexflow/phase3c-event-runtime-master-map
          git rebase origin/codexflow/phase3c-event-runtime-master-map
          git push origin HEAD:codexflow/phase3c-event-runtime-master-map
