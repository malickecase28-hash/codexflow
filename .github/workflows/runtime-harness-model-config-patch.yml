name: Runtime harness model config patch

on:
  push:
    branches:
      - codexflow/phase3c-event-runtime-master-map
    paths:
      - .github/workflows/runtime-harness-model-config-patch.yml
      - scripts/apply-runtime-harness-model-config.py

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codexflow/phase3c-event-runtime-master-map
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Normalize intentionally duplicated trait anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-runtime-harness-model-config.py")
          text = path.read_text()
          old = '''    if count != 1:
                  raise SystemExit(f"{path}: expected one patch anchor, found {count}")
          '''
          new = '''    if count == 0:
                  raise SystemExit(f"{path}: expected patch anchor, found none")
              if count > 1 and not (
                  path.endswith("runtime-harness/src/router.rs")
                  and old == "    fn prompt<'a>(\\n"
                  and count == 2
              ):
                  raise SystemExit(f"{path}: expected one patch anchor, found {count}")
          '''
          if text.count(old) != 1:
              raise SystemExit("patch helper guard changed unexpectedly")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply exact model config patch
        run: python3 scripts/apply-runtime-harness-model-config.py
      - name: Format
        run: cargo fmt --manifest-path codex-rs/runtime-harness/Cargo.toml --all
      - name: Test
        run: cargo test --manifest-path codex-rs/runtime-harness/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path codex-rs/runtime-harness/Cargo.toml --all-targets -- -D warnings
      - name: Commit validated patch
        run: |
          rm .github/workflows/runtime-harness-model-config-patch.yml
          rm scripts/apply-runtime-harness-model-config.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(runtime): apply selected Cursor model through ACP"
          git push origin HEAD:codexflow/phase3c-event-runtime-master-map
