name: Runtime harness TUI bridge stage

on:
  push:
    branches:
      - codexflow/runtime-harness-tui-stage-2
    paths:
      - .github/workflows/runtime-harness-tui-bridge-stage.yml
      - scripts/apply-runtime-tui-bridge-stage.py
      - codex-rs/tui/src/runtime_bridge.rs

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codexflow/runtime-harness-tui-stage-2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply TUI dependency and startup wiring
        run: python scripts/apply-runtime-tui-bridge-stage.py
      - name: Format
        working-directory: codex-rs
        run: cargo fmt --all
      - name: Check shipping TUI graph
        working-directory: codex-rs
        run: cargo check -p codex-tui --all-targets
      - name: Clippy TUI library
        working-directory: codex-rs
        run: cargo clippy -p codex-tui --lib -- -D warnings
      - name: Commit validated bridge
        shell: bash
        run: |
          git rm .github/workflows/runtime-harness-tui-bridge-stage.yml scripts/apply-runtime-tui-bridge-stage.py
          git add codex-rs/Cargo.toml codex-rs/Cargo.lock codex-rs/runtime-harness/Cargo.toml codex-rs/tui
          if git diff --cached --quiet; then
            echo "No validated TUI bridge changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(runtime): wire persistent harness into shipping TUI"
          git push origin HEAD:codexflow/runtime-harness-tui-stage-2
