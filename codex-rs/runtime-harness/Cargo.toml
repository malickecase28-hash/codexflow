[package]
name = "codex-runtime-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[workspace]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.rust]

[workspace.lints.clippy]

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync"] }
tracing = "0.1"
subswap-core = { git = "https://github.com/x0c/subswap", rev = "c839bd4de69397612d09fdc9312e03cf6e9c9e05" }
subswap-provider-codex = { git = "https://github.com/x0c/subswap", rev = "c839bd4de69397612d09fdc9312e03cf6e9c9e05" }
subswap-provider-cursor = { git = "https://github.com/x0c/subswap", rev = "c839bd4de69397612d09fdc9312e03cf6e9c9e05" }

[dev-dependencies]
tempfile = "3"
